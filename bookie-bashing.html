<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookie Bashing</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #38003c;
    background-image: radial-gradient(circle at 15% 0%, #4b0f52 0%, #38003c 45%), radial-gradient(circle at 100% 100%, #2b002e 0%, #38003c 55%);
    color: #ffffff;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 28px 18px 60px; }
  .header {
    text-align: center;
    margin-bottom: 28px;
    padding-bottom: 22px;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 64px; height: 5px;
    background: linear-gradient(90deg, #00ff85, #04f5ff, #e90052);
    border-radius: 3px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 3px;
    color: #04f5ff;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 42px;
    margin: 2px 0 6px;
    font-weight: 900;
    letter-spacing: -1px;
    font-style: italic;
    color: #ffffff;
    text-transform: uppercase;
    line-height: 1;

  .sub { font-size: 13px; color: #c9a8ce; }
  .update-note { font-size: 11px; color: #c9a8ce; margin-top: 8px; font-style: italic; }
  .sync-status { font-size: 10px; word-break: break-word; letter-spacing: 1px; text-transform: uppercase; color: #a882ac; margin-top: 6px; }
  .season-line { font-size: 11px; color: #04f5ff; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; margin-top: 10px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #2b002e;
    border: 1px solid #55105c;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 24px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
  }
  thead tr { background: #1a0020; }
  th {
    padding: 12px 5px;
    text-align: left;
    font-size: 10px;
    letter-spacing: 0.5px;
    color: #04f5ff;
    text-transform: uppercase;
    font-weight: 700;
  }
  th.center, td.center { text-align: center; }
  tbody tr { border-bottom: 1px solid #4a0e50; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr.leader { background: linear-gradient(90deg, rgba(0,255,133,0.14), rgba(0,255,133,0.03)); box-shadow: inset 3px 0 0 #00ff85; }
  td { padding: 12px 5px; }
  td.name { font-weight: 700; font-size: 14px; color: #ffffff; }
  td.pts { font-weight: 900; font-size: 19px; color: #00ff85; }
  .w { color: #00ff85; } .d { color: #04f5ff; } .l { color: #ff5c8a; }
  .rank { color: #a882ac; font-weight: 700; }
  td.avg-odds { text-align:center; color:#04f5ff; font-weight:700; font-size:13px; }
  .live-pts { font-size:11px; font-weight:800; color:#04f5ff; margin-left:2px; vertical-align:super; }
  .live-flag { font-size:10px; color:#04f5ff; letter-spacing:1px; text-transform:uppercase; font-weight:700; margin-top:6px; }
  td.prize { text-align:center; color:#e9c46a; font-weight:800; font-size:13px; }
  .badge-img { border-radius: 50%; object-fit: cover; vertical-align: middle; border: 2px solid #55105c; background: #1a0020; }
  tbody tr.leader .badge-img { border-color: #00ff85; }
  .name-cell { display: flex; align-items: center; gap: 7px; }

  .panel { background: #2b002e; border: 1px solid #55105c; border-radius: 10px; padding: 20px; margin-bottom: 22px; }
  label { font-size: 11px; color: #04f5ff; letter-spacing: 1.5px; text-transform: uppercase; display: block; margin-bottom: 6px; font-weight: 700; }
  input[type=text] {
    width: 100%; padding: 10px 12px; background: #1a0020; border: 1px solid #55105c;
    border-radius: 6px; color: #ffffff; font-size: 15px; font-family: inherit;
  }
  input[type=text]:focus { outline: none; border-color: #04f5ff; }
  .already-note { font-size: 11px; color: #04f5ff; margin-bottom: 10px; }
  .person-block { margin-bottom: 18px; padding-top: 14px; border-top: 1px solid #4a0e50; }
  .person-name { font-weight: 800; color: #ffffff; margin-bottom: 10px; font-size: 15px; }
  .pick-row { display: flex; gap: 8px; margin-bottom: 8px; position: relative; }
  .team-search-wrap { flex: 1; position: relative; }
  .team-search-wrap { flex: 1 1 auto; min-width: 0; position: relative; }
  .pick-row .team-input { width: 100%; padding: 9px 10px; background: #1a0020; border: 1px solid #55105c; border-radius: 6px; color: #ffffff; font-size: 14px; font-family: inherit; }
  .pick-row input:focus { outline: none; border-color: #04f5ff; }
  select {
    padding: 9px 10px; border: 1px solid #55105c; border-radius: 6px; font-size: 14px; font-weight: 700; font-family: inherit; background: #1a0020; color: #fff;
  }
  .autocomplete-list {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
    background: #1a0020; border: 1px solid #55105c; border-top: none;
    border-radius: 0 0 6px 6px; max-height: 220px; overflow-y: auto; display: none;
  }
  .autocomplete-list.open { display: block; }
  .autocomplete-item { padding: 9px 12px; font-size: 13px; color: #e8d4ea; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .autocomplete-item:hover, .autocomplete-item.active { background: #38003c; }
  .autocomplete-item .league-tag { color: #04f5ff; font-size: 10px; white-space: nowrap; font-weight: 700; text-transform: uppercase; }
  .btn {
    padding: 12px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 15px; font-family: inherit; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .btn-gold { background: #00ff85; color: #1a0020; }
  .btn-ghost { background: transparent; color: #c9a8ce; border: 1px solid #55105c; }
  .btn-row { display: flex; gap: 10px; }
  .add-btn {
    width: 100%; padding: 15px; background: #00ff85; color: #1a0020; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 800; cursor: pointer; margin-bottom: 22px; font-family: inherit;
    text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 14px rgba(0,255,133,0.25);

  .history-label { font-size: 12px; letter-spacing: 1.5px; color: #04f5ff; text-transform: uppercase; margin-bottom: 10px; font-weight: 700; }
  .gw-card { background: #2b002e; border: 1px solid #4a0e50; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .gw-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .pick-row .odds-input { flex: 0 0 78px; width: 78px; padding: 9px 8px; background:#1a0020; border:1px solid #55105c; border-radius:6px; color:#fff; font-size:14px; font-family:inherit; text-align:center; }
  .odds-input:focus { outline:none; border-color:#04f5ff; }
  .odds-chip { font-size:10px; opacity:.75; font-weight:800; }
  .lock-note { color:#04f5ff; font-weight:400; font-size:11px; }
  .gw-toggle { cursor:pointer; user-select:none; flex:1; }
  .chev { color:#04f5ff; font-size:11px; margin-right:2px; }
  .gw-summary { font-size:11px; color:#a882ac; font-weight:400; }
  .gw-card.collapsed { padding:12px 14px; }
  .gw-title { font-weight: 800; color: #ffffff; }
  .del-btn { background: none; border: none; color: #a882ac; cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  .gw-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; color: #e8d4ea; align-items: center; }
  .badge { padding: 3px 9px; border-radius: 20px; font-weight: 700; margin-left: 6px; }
  .error { color: #ff5c8a; font-size: 13px; margin-bottom: 12px; }
  .kitty { background: #2b002e; border: 1px solid #55105c; border-radius: 10px; padding: 16px 18px; margin-bottom: 22px; }
  .kitty-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .kitty-label { font-size: 12px; letter-spacing: 1.5px; color: #04f5ff; text-transform: uppercase; font-weight: 700; }
  .kitty-total { font-size: 26px; font-weight: 900; color: #00ff85; }
  .kitty-total small { font-size: 12px; color: #a882ac; font-weight: 400; margin-left: 6px; }
  .pot-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; font-size:13px; color:#e8d4ea; }
  .pot-total { font-size:20px; font-weight:900; color:#e9c46a; }
  .pot-note { font-size:11px; color:#a882ac; padding-bottom:4px; }
  .debt-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 8px 0; border-top: 1px solid #4a0e50; color: #e8d4ea; gap: 10px; }
  .debt-amount { font-weight: 800; color: #e90052; background: rgba(233,0,82,0.14); padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .owed-clear { font-size: 13px; color: #00ff85; padding-top: 8px; border-top: 1px solid #4a0e50; }
  .arrears { font-size: 12px; color: #ff5c8a; padding: 7px 0; border-top: 1px solid #4a0e50; }
  .pay-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; padding: 5px 0; color: #c9a8ce; }
  .pay-controls { display: flex; gap: 6px; align-items: center; }
  .pay-controls select { padding: 5px 8px; font-size: 12px; border-radius: 6px; }
  .settled-toggle { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #a882ac; cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 400; margin: 0; }
  .settled-toggle input { accent-color: #00ff85; margin: 0; }
  .pay-divider { margin: 12px 0 4px; font-size: 10px; letter-spacing: 1.5px; color: #7d5983; text-transform: uppercase; font-weight: 700; border-top: 1px solid #4a0e50; padding-top: 10px; }
  .picker { background:#2b002e; border:1px solid #55105c; border-radius:10px; padding:16px 18px; margin-bottom:22px; }
  .picker-head { font-size:14px; font-weight:800; color:#00ff85; margin-bottom:12px; }
  .picker-sub { font-size:11px; color:#a882ac; margin:-8px 0 12px; }
  .picker-who { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .picker-who select { flex:1; padding:8px 10px; font-size:13px; }
  .picker-count { font-size:11px; color:#a882ac; text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap; }
  .picker-mine { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .picker-chip { background:#00ff85; color:#1a0020; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:800; cursor:pointer; }
  .picker-list { max-height:330px; overflow-y:auto; border-top:1px solid #4a0e50; padding-top:8px; }
  .lg-head { display:flex; align-items:center; gap:6px; font-size:11px; letter-spacing:0.5px; text-transform:uppercase; color:#04f5ff; font-weight:700; margin:12px 0 6px; cursor:pointer; user-select:none; }
  .lg-count { margin-left:auto; color:#7d5983; font-weight:400; text-transform:none; letter-spacing:0; }
  .picker-day { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:#04f5ff; font-weight:700; margin:10px 0 4px; }
  .fixture { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .side { flex:1; padding:9px 8px; background:#1a0020; border:1px solid #55105c; border-radius:6px; color:#e8d4ea; font-size:12px; font-family:inherit; cursor:pointer; text-align:center; line-height:1.2; }
  .side.sel { background:#00ff85; color:#1a0020; border-color:#00ff85; font-weight:800; }
  .side-prob { color:#a882ac; font-weight:600; }
  .side.sel .side-prob { color:#1a4030; }
  .side-odds { display:block; font-size:11px; font-weight:800; color:#04f5ff; margin-top:2px; }
  .side.sel .side-odds { color:#1a0020; }
  .vs { font-size:10px; color:#7d5983; white-space:nowrap; }
  .picker-note { font-size:11px; color:#a882ac; margin-top:10px; font-style:italic; }

  .claude-h2h { display:block; font-size:9px; color:#a882ac; font-weight:600; white-space:nowrap; }
  .claude-prob { color:#e9c46a; font-weight:800; font-size:13px; width:56px; text-align:right; }

  .follow-table td { padding:9px 4px; border-top:1px solid #4a0e50; font-size:13px; color:#fff; vertical-align:middle; }

  .flashscore-btn { display:block; text-align:center; margin-top:12px; padding:11px; background:transparent; color:#04f5ff; border:1px solid #55105c; border-radius:8px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; text-decoration:none; }
  .follow-note { font-size:11px; color:#a882ac; margin-top:10px; font-style:italic; }
  .backfill-btn { width:100%; padding:11px; background:transparent; color:#04f5ff; border:1px solid #55105c; border-radius:8px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; margin-bottom:14px; font-family:inherit; }
  .reset-link { margin-top: 18px; background: none; border: none; color: #7d5983; font-size: 12px; cursor: pointer; }
</style>

    <div class="eyebrow">The Syndicate Presents</div>

  <div id="historySection"></div>

function setFixStatus(text, tone) {

function initFirebase() {
  if (typeof FIREBASE_CONFIG === 'undefined' || !FIREBASE_CONFIG.databaseURL || FIREBASE_CONFIG.databaseURL.indexOf('PASTE') === 0) {
    setStatus('Not connected \u2014 add your Firebase config to share this league', 'bad');
    picks = [SEED_WEEK_1];
    renderAll();
    return;
  }
  if (typeof firebase === 'undefined') {
    setStatus('Firebase SDK blocked here \u2014 host on GitHub Pages or Netlify to sync', 'bad');
    picks = [SEED_WEEK_1];
    renderAll();
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    seasonRef = firebase.database().ref('bookieBashing/weeks');
    boardRef = firebase.database().ref('bookieBashing/oddsBoard');
    boardRef.on('value', (snap) => { oddsBoard = snap.val() || {}; renderPickPrompt(); });
    setStatus('Connecting\u2026');

    // Live listener: fires on first load and whenever anyone changes anything
    seasonRef.on('value', (snap) => {
      const val = snap.val();
      if (!val) {
        picks = [SEED_WEEK_1];
        dbReady = true;
        saveWeek(SEED_WEEK_1);
      } else {
        // stored as { week_1: {...}, week_2: {...} }
        picks = Object.keys(val).map(k => val[k])
                      .filter(Boolean)
                      .sort((a, b) => (a.week || 0) - (b.week || 0));
        dbReady = true;
      }
      setStatus('Live \u2014 shared with the syndicate', 'good');
      renderAll();
    }, (err) => {
      setStatus('Connection problem \u2014 changes may not save', 'bad');
      if (!picks.length) { picks = [SEED_WEEK_1]; renderAll(); }
    });
  } catch (e) {
    setStatus('Could not connect to Firebase', 'bad');
    picks = [SEED_WEEK_1];
    renderAll();
  }
}

// Write a single match week. Never touches the others, so two phones
// saving at once can't wipe each other.
function saveWeek(gw) {
  if (!seasonRef || !dbReady || !gw || !gw.week) return;
  seasonRef.child('week_' + gw.week).set(gw)
    .catch(() => setStatus('Save failed \u2014 try again', 'bad'));
}

function deleteWeek(week) {
  if (!seasonRef || !dbReady) return;
  seasonRef.child('week_' + week).remove()
    .catch(() => setStatus('Delete failed \u2014 try again', 'bad'));
}

// Kept for call sites that changed one or more weeks in place
function save(data, touched) {
  if (!seasonRef || !dbReady) {
    setStatus('Not saved \u2014 no connection', 'bad');
    return;
  }
  const list = touched ? (Array.isArray(touched) ? touched : [touched]) : (data || picks);
  list.forEach(saveWeek);
}

// Weeks already logged

// Lowest week that isn't complete (fewer than all three punters logged)
function nextFreeWeek() {
  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    const gw = picks.find(g => g.week === w);
    const count = gw && gw.entries ? PARTICIPANTS.filter(p => gw.entries[p]).length : 0;
    if (count < PARTICIPANTS.length) return w;
  }
  return null;
}

// How many punters have logged for a given week
function loggedCount(w) {
  const gw = picks.find(g => g.week === w);
  return gw && gw.entries ? PARTICIPANTS.filter(p => gw.entries[p]).length : 0;
}

function populateWeekSelect() {
  const sel = document.getElementById('gwName');
  const next = nextFreeWeek();
  let html = '';
  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    const gw = picks.find(g => g.week === w);
    const count = gw ? PARTICIPANTS.filter(p => gw.entries && gw.entries[p]).length : 0;
    const tag = count === 3 ? ' \u2014 all in' : count > 0 ? ` \u2014 ${count} of 3 in` : '';
    html += `<option value="${w}"${w === next ? ' selected' : ''}>Match week ${w}${tag}</option>`;

// ---- Automatic odds + results -----------------------------------------
// Reads from odds-api.io and fills in prices, then settles results once
// the Saturday 5pm lock has lifted. Never overwrites anything already set
// by hand.

function normaliseTeam(n) {
  return String(n || '')
    .toLowerCase()
    .replace(/&/g, 'and')
    .replace(/\b(fc|afc|association football club|football club)\b/g, '')
    .replace(/\bunited\b/g, 'utd')
    .replace(/\bwanderers\b/g, 'wdrs')
    .replace(/\balbion\b/g, '')
    .replace(/\bcity\b/g, '')
    .replace(/\btown\b/g, '')
    .replace(/\brovers\b/g, '')
    .replace(/\bcounty\b/g, '')
    .replace(/\bathletic\b/g, '')
    .replace(/[^a-z0-9]/g, '')
    .trim();
}

function teamsMatch(a, b) {
  const x = normaliseTeam(a), y = normaliseTeam(b);
  if (!x || !y) return false;
  if (x === y) return true;
  // allow a short suffix only (e.g. 'wolves' vs 'wolverhampton'), never
  // enough room for a u21/reserves marker
  const longer = x.length > y.length ? x : y;
  const shorter = x.length > y.length ? y : x;
  if (!longer.startsWith(shorter)) return false;
  const extra = longer.slice(shorter.length);
  return extra.length <= 2 && !/\d/.test(extra);
}

// Pull the 1X2 home/away price out of whatever shape the bookmaker block is
function extractMoneyline(ev) {
  const books = ev.bookmakers || {};
  for (const bk of Object.keys(books)) {
    const markets = books[bk] || [];
    for (const m of markets) {
      const nm = (m.name || '').toLowerCase();
      if (nm === 'ml' || nm.includes('money') || nm.includes('1x2') || nm.includes('match')) {
        const o = (m.odds && m.odds[0]) || {};
        const home = parseFloat(o.home), away = parseFloat(o.away);
        const draw = parseFloat(o.draw !== undefined ? o.draw : o.x);
        if (!isNaN(home) || !isNaN(away)) return { home, away, draw };
      }
    }
  }
  return null;
}

// Work out win/draw/lose for the team the punter backed
function outcomeFor(ev, team) {
  const sc = ev.score || ev.scores || ev.result || null;
  if (!sc) return null;
  const h = parseInt(sc.home ?? sc.homeScore ?? sc.ft?.home, 10);
  const a = parseInt(sc.away ?? sc.awayScore ?? sc.ft?.away, 10);
  if (isNaN(h) || isNaN(a)) return null;
  const status = String(ev.status || ev.state || '').toLowerCase();
  const finished = !status || status.includes('ft') || status.includes('final')
                 || status.includes('finish') || status.includes('end');
  if (!finished) return null;
  const backedHome = teamsMatch(team, ev.home);
  if (h === a) return 'draw';
  const homeWon = h > a;
  return (backedHome === homeWon) ? 'win' : 'lose';
}

let rateLimitedUntil = 0;
let liveEvents = [];

async function syncOddsAndResults() {
  if (Date.now() < rateLimitedUntil) {
    const mins = Math.ceil((rateLimitedUntil - Date.now()) / 60000);
    setOdds('Odds feed: rate limited \u2014 retrying in ' + mins + ' min', 'bad');
    return;
  }
  if (typeof ODDS_API_KEY === 'undefined' || ODDS_API_KEY.indexOf('PASTE') === 0) return;
  if (!picks.length || !dbReady) return;

  let events = [];
  setOdds('Odds feed: checking\u2026');
  try {
    const res = await fetch('https://api.odds-api.io/v3/events?sport=football&apiKey=' + encodeURIComponent(ODDS_API_KEY));
    if (res.status === 429) {
      rateLimitedUntil = Date.now() + 3600000;
      setOdds('Odds feed: hourly limit reached \u2014 retrying in 60 min', 'bad');
      return;
    }
    if (!res.ok) { setOdds('Odds feed: HTTP ' + res.status, 'bad'); return; }
    const data = await res.json();
    events = Array.isArray(data) ? data : (data.events || data.data || data.results || []);
    if (!Array.isArray(events)) { setOdds('Odds feed: unexpected shape \u2014 ' + Object.keys(data).slice(0,4).join(','), 'bad'); return; }
  } catch (e) {
    setOdds('Odds feed blocked: ' + (e.message || 'network/CORS'), 'bad');
    return;
  }
  if (!events.length) { setOdds('Odds feed: 0 events returned', 'bad'); return; }
  events = events.filter(isSeniorMens);
  liveEvents = events;
  renderAll();   // recalculate the table with in-play scores
  window.__evDebug = 'event keys: ' + Object.keys(events[0] || {}).slice(0, 8).join(',');

  let changed = 0, wanted = 0, matched = 0, needed = 0;
  const touched = new Set();

  // Cache odds per event so we only ask once per fixture
  const oddsCache = {};
  let oddsCalls = 0;
  const MAX_ODDS_CALLS = 12;
  // The odds endpoint needs a bookmaker; the free tier only allows a couple,
  // so try a few common ones until one answers.
  // The two bookmakers selected on the odds-api.io free tier.
  let BOOKS = ['Bet365,Unibet'];
  let goodBook = null;

  // Ask the API which bookmakers this key can actually use
  async function discoverBooks() {
    try {
      const r = await fetch('https://api.odds-api.io/v3/bookmakers?apiKey='
                          + encodeURIComponent(ODDS_API_KEY));
      if (!r.ok) return;
      const d = await r.json();
      const list = Array.isArray(d) ? d : (d.bookmakers || d.data || []);
      const names = list
        .filter(b => b && (b.active === undefined || b.active))
        .map(b => b.name || b.slug || b)
        .filter(n => typeof n === 'string');
      if (names.length) {
        BOOKS = names.slice(0, 12);
        window.__bookDebug = 'books available: ' + names.slice(0, 4).join(',');
      }
    } catch (e) { /* fall back to the guessed list */ }
  }

  async function tryOdds(id, book) {
    let url = 'https://api.odds-api.io/v3/odds?eventId=' + encodeURIComponent(id)
            + '&apiKey=' + encodeURIComponent(ODDS_API_KEY);
    if (book) url += '&bookmakers=' + encodeURIComponent(book);
    const r = await fetch(url);
    if (!r.ok) {
      let body = '';
      try { body = (await r.text()).slice(0, 90); } catch (e) {}
      return { ok: false, status: r.status, body: body };
    }
    return { ok: true, data: await r.json() };
  }

  async function oddsForEvent(id) {
    if (id in oddsCache) return oddsCache[id];
    if (oddsCalls >= MAX_ODDS_CALLS) return null;
    oddsCalls++;
    let lastErr = '';
    const order = goodBook ? [goodBook] : BOOKS;
    for (const book of order) {
      try {
        const res = await tryOdds(id, book);
            if (res.status === 429) { rateLimitedUntil = Date.now() + 3600000; return null; }
        if (!res.ok) { lastErr = (book || 'none') + '=' + res.status + ':' + res.body; continue; }
        goodBook = book;
        const d = res.data;
        if (!window.__oddsDebug) {
          window.__oddsDebug = 'book=' + (book || 'none')
            + ' keys:' + Object.keys(d || {}).slice(0, 5).join(',');
          const bk = d && d.bookmakers;
          if (bk) {
            const names = Object.keys(bk).slice(0, 2);
            window.__oddsDebug += ' books:' + names.join(',');
            const first = bk[names[0]];
            if (Array.isArray(first)) window.__oddsDebug += ' mkts:' + first.map(m => m.name).slice(0, 4).join('/');
          }
        }
        const ml = extractMoneyline(d && d.bookmakers ? d : { bookmakers: (d && d.bookmakers) || d });
        oddsCache[id] = ml;
        return ml;
      } catch (e) {
        lastErr = e.message || 'fetch error';
      }
    }
    if (!window.__oddsDebug) window.__oddsDebug = (window.__bookDebug ? window.__bookDebug + ' | ' : '') + 'last: ' + lastErr;
    oddsCache[id] = null;
    return null;
  }

  // only bother with the last couple of match weeks
  const recent = [...picks].sort((a, b) => (b.week || 0) - (a.week || 0)).slice(0, 3);

  for (const gw of recent) {
    const unlocked = !resultsLocked(gw);
    for (const person of PARTICIPANTS) {
      const list = (gw.entries && gw.entries[person]) || [];
      for (const pick of list) {
        wanted++;
        const ev = findEvent(events, pick.team);
        if (!ev) continue;
        matched++;

        // odds: fetched per fixture, only if not already set
        if (!pick.odds && ev.id) {
          needed++;
          const ml = extractMoneyline(ev) || await oddsForEvent(ev.id);
          if (ml) {
            const price = teamsMatch(pick.team, ev.home) ? ml.home : ml.away;
            if (price && price > 1) { pick.odds = price; changed++; touched.add(gw); }
          }
        }
        // result: only once unlocked and still pending
        if (unlocked && pick.result === 'pending') {
          const out = outcomeFor(ev, pick.team);
          if (out) { pick.result = out; changed++; touched.add(gw); }
        }
      }
    }
  }

  const priced = Object.values(oddsCache).filter(Boolean).length;
  if (needed === 0) {
    setOdds(`Odds feed: all ${matched} picks priced`, 'good');
  } else if (priced === 0) {
    setOdds('Odds feed: ' + (window.__oddsDebug || 'no prices returned'), 'bad');
  } else {
    setOdds(`Odds feed: matched ${matched}/${wanted} \u00b7 ${changed} priced`, 'good');
  }
  if (changed) {
    touched.forEach(saveWeek);
    renderAll();
  }
}

// --- Fractional odds ---------------------------------------------------
// Stored as decimal so averages are sound; shown as the nearest
// traditional bookmaker fraction.
const ODDS_LADDER = [
  [1,10],[1,9],[1,8],[1,7],[1,6],[1,5],[2,9],[1,4],[2,7],[3,10],[1,3],[4,11],
  [2,5],[4,9],[1,2],[8,15],[4,7],[8,13],[2,3],[8,11],[4,5],[5,6],[10,11],[1,1],
  [11,10],[6,5],[5,4],[11,8],[3,2],[8,5],[13,8],[7,4],[15,8],[2,1],[85,40],[9,4],
  [5,2],[11,4],[3,1],[10,3],[7,2],[4,1],[9,2],[5,1],[11,2],[6,1],[13,2],[7,1],
  [15,2],[8,1],[9,1],[10,1],[11,1],[12,1],[14,1],[16,1],[20,1],[25,1],[33,1],[50,1]
];

function toFractional(dec) {
  if (!dec || dec <= 1) return '\u2014';
  const target = dec - 1;
  let best = ODDS_LADDER[0], bestGap = Infinity;
  for (const [n, d] of ODDS_LADDER) {
    const gap = Math.abs(n / d - target);
    if (gap < bestGap) { bestGap = gap; best = [n, d]; }
  }
  if (best[0] === 1 && best[1] === 1) return 'Evens';
  return best[0] + '/' + best[1];
}

// Accepts "5/4", "2.25" or "evens"
function parseOdds(raw) {
  if (!raw) return null;
  const t = String(raw).trim().toLowerCase();
  if (!t) return null;
  if (t === 'evens' || t === 'evs' || t === 'even') return 2;
  if (t.includes('/')) {
    const [n, d] = t.split('/').map(parseFloat);
    if (!isNaN(n) && !isNaN(d) && d > 0) return n / d + 1;
    return null;
  }
  const v = parseFloat(t);
  return !isNaN(v) && v > 1 ? v : null;
}

// The Saturday 5pm that results unlock for a week created now
function upcomingSaturday5pm(from) {
  const d = new Date(from || Date.now());
  const day = d.getDay();               // 0 Sun ... 6 Sat
  const past5 = day === 6 && d.getHours() >= 17;
  let add = (6 - day + 7) % 7;          // days until Saturday
  if (day === 6 && !past5) add = 0;     // today, still before 5pm
  if (past5) add = 7;                   // already gone, so next Saturday
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate() + add, 17, 0, 0, 0);
  return t.getTime();
}

// Results stay locked until that moment. Weeks with no stored lock are open.
function resultsLocked(gw) {
  if (!gw || !gw.lockUntil) return false;
  return Date.now() < gw.lockUntil;
}

function lockMessage(gw) {
  const ms = gw.lockUntil - Date.now();
  if (ms <= 0) return '';
  const hrs = Math.floor(ms / 3600000);
  if (hrs >= 24) {
    const days = Math.round(hrs / 24);
    return `results unlock in ${days} day${days > 1 ? 's' : ''}`;
  }
  if (hrs >= 1) return `results unlock in ${hrs} hour${hrs > 1 ? 's' : ''}`;
  return `results unlock in under an hour`;
}

// Ensure any gameweek (including older saved ones) has a payments block
function paymentsFor(gw) {
  if (!gw.payments) gw.payments = {};
  PARTICIPANTS.forEach(p => {
    if (!gw.payments[p]) gw.payments[p] = { status: 'unpaid', by: null };
  });
  return gw.payments;
}

// The week the kitty is currently collecting for (highest week logged)
function currentWeek() {
  const ws = usedWeeks();
  return ws.length ? Math.max(...ws) : null;
}

// Kitty for the current week only - resets each week
function kittyTotals() {
  const w = currentWeek();
  const gw = picks.find(g => g.week === w);
  let banked = 0, outstanding = 0;
  if (gw) {
    const pay = paymentsFor(gw);
    PARTICIPANTS.forEach(p => {
      if (pay[p].status === 'paid' || pay[p].status === 'covered') banked += STAKE;
      else outstanding += STAKE;
    });
  }
  return { banked, outstanding, week: w };
}

// Net off debts between each pair so A owes B a single figure
function netDebts() {
  const raw = {};
  PARTICIPANTS.forEach(a => {
    raw[a] = {};
    PARTICIPANTS.forEach(b => { if (a !== b) raw[a][b] = 0; });
  });

  picks.forEach(gw => {
    const pay = paymentsFor(gw);
    PARTICIPANTS.forEach(p => {
      const st = pay[p];
      if (st.status === 'covered' && !st.settled && st.by && st.by !== p && raw[p] && raw[p][st.by] !== undefined) {
        raw[p][st.by] += STAKE;
      }
    });
  });

  const settled = [];
  for (let i = 0; i < PARTICIPANTS.length; i++) {
    for (let j = i + 1; j < PARTICIPANTS.length; j++) {
      const a = PARTICIPANTS[i], b = PARTICIPANTS[j];
      const net = raw[a][b] - raw[b][a];
      if (net > 0) settled.push({ debtor: a, creditor: b, amount: net });
      else if (net < 0) settled.push({ debtor: b, creditor: a, amount: -net });
    }
  }
  return settled;
}

// Weeks where this person still owes their own stake
function unpaidWeeks(person) {
  return picks.filter(gw => paymentsFor(gw)[person].status === 'unpaid').map(gw => gw.week);
}

function computeTable() {
  return PARTICIPANTS.map(p => {
    const rounds = picks.flatMap(gw => gw.entries[p] || []);
    const settled = rounds.filter(r => r.result !== 'pending');
    const points = settled.reduce((sum, r) => sum + pointsFor(r.result), 0);
    const wins = settled.filter(r => r.result === 'win').length;
    const draws = settled.filter(r => r.result === 'draw').length;
    const losses = settled.filter(r => r.result === 'lose').length;
    const pendingCount = rounds.length - settled.length;
    // in-play: what pending picks are worth if the score stood right now
    let livePts = 0, liveOn = 0;
    rounds.filter(r => r.result === 'pending').forEach(r => {
      const ev = findEvent(liveEvents, r.team);
      const sc = ev ? scoreOf(ev) : null;
      if (!sc) return;
      const atHome = teamsMatch(r.team, ev.home);
      const mine = atHome ? sc.h : sc.a;
      const theirs = atHome ? sc.a : sc.h;
      livePts += mine > theirs ? 3 : 0;
      liveOn++;
    });
    const priced = rounds.filter(r => typeof r.odds === 'number' && r.odds > 0);
    const avgOdds = priced.length ? priced.reduce((a, r) => a + r.odds, 0) / priced.length : null;
    return { name: p, points, wins, draws, losses, played: settled.length, pending: pendingCount, avgOdds, livePts, liveOn };
  }).sort((a,b) =>
       (b.points + b.livePts) - (a.points + a.livePts)   // live-adjusted total
    || b.points - a.points                                // then settled points
    || b.wins - a.wins                                    // then wins
    || b.draws - a.draws                                  // then draws over defeats
    || a.losses - b.losses);                              // fewest defeats
}

function setupAutocomplete(wrap) {
  const input = wrap.querySelector('.team-input');
  const list = wrap.querySelector('.autocomplete-list');
  let activeIndex = -1;
  let currentMatches = [];

  function renderMatches(query) {
    const q = query.trim().toLowerCase();
    if (!q) {
      list.classList.remove('open');
      list.innerHTML = '';
      currentMatches = [];
      return;
    }
    currentMatches = CLUBS.filter(([name]) => name.toLowerCase().includes(q)).slice(0, 8);
    if (currentMatches.length === 0) {
      list.innerHTML = `<div class="autocomplete-item" style="color:#665f4d; cursor:default;">No match &mdash; you can still type your own</div>`;
      list.classList.add('open');
      return;
    }
    activeIndex = -1;
    list.innerHTML = currentMatches.map(([name, league], i) =>
      `<div class="autocomplete-item" data-index="${i}"><span>${escapeHtml(name)}</span><span class="league-tag">${LEAGUE_LABELS[league] || league}</span></div>`
    ).join('');
    list.classList.add('open');
    list.querySelectorAll('.autocomplete-item[data-index]').forEach(item => {
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const idx = Number(item.getAttribute('data-index'));
        input.value = currentMatches[idx][0];
        list.classList.remove('open');
      });
    });
  }

  input.addEventListener('input', () => renderMatches(input.value));
  input.addEventListener('focus', () => { if (input.value.trim()) renderMatches(input.value); });
  input.addEventListener('blur', () => {
    setTimeout(() => list.classList.remove('open'), 120);
  });
  input.addEventListener('keydown', (e) => {
    const items = list.querySelectorAll('.autocomplete-item[data-index]');
    if (!items.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, items.length - 1);
      items.forEach((it, i) => it.classList.toggle('active', i === activeIndex));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      items.forEach((it, i) => it.classList.toggle('active', i === activeIndex));
    } else if (e.key === 'Enter') {
      if (activeIndex >= 0 && currentMatches[activeIndex]) {
        e.preventDefault();
        input.value = currentMatches[activeIndex][0];
        list.classList.remove('open');
      }
    } else if (e.key === 'Escape') {
      list.classList.remove('open');
    }
  });
}

// Youth, reserve and women's fixtures are separate competitions - never
// what someone means when they back a club.
function isSeniorMens(ev) {
  const blob = [ev && ev.home, ev && ev.away,
                ev && ev.league && (ev.league.name || ev.league.slug) || '']
                .join(' ').toLowerCase();
  return !/\b(u\s?1[5-9]|u\s?2[0-3]|under[- ]?\d+|youth|academy|reserves?|women|ladies|femin|w\.?f\.?c)\b/.test(blob)
      && !/\bii\b/.test(blob);
}

// Prefer an exact name match before falling back to a looser one
function findEvent(list, team) {
  const t = normaliseTeam(team);
  let hit = list.find(e => normaliseTeam(e.home) === t || normaliseTeam(e.away) === t);
  if (hit) return hit;
  return list.find(e => teamsMatch(team, e.home) || teamsMatch(team, e.away));
}

// Best-effort score read - the free tier may not expose these
function scoreOf(ev) {
  const sc = ev && (ev.score || ev.scores || ev.result);
  if (!sc) return null;
  const h = sc.home ?? sc.homeScore ?? (sc.ft && sc.ft.home);
  const a = sc.away ?? sc.awayScore ?? (sc.ft && sc.ft.away);
  if (h === undefined || a === undefined || h === null || a === null) return null;
  return { h: h, a: a };
}

function kickoffOf(ev) {
  if (!ev || !ev.date) return '';
  try {
    const d = new Date(ev.date);
    return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  } catch (e) { return ''; }
}


// ---- "Get your picks in" fixture picker --------------------------------
// Opens from 5.30pm Saturday for the next match week, and stays open until
// the following Saturday kicks off.
function picksWindowOpen() {
  const d = new Date();
  const day = d.getDay(), hr = d.getHours(), mins = d.getHours() * 60 + d.getMinutes();
  if (day === 6) return mins >= 17 * 60 + 15;   // Sat from 17:15
  return true;                                   // Sun-Fri
}

let pickerWho = PARTICIPANTS[0];
let openLeagues = null;   // null = Premier League only

let teamForm = {};        // { 'Everton': { pts: 9, played: 5, seq: 'WWLDW' } }

// Recent form, derived from settled results in the same leagues using the
// odds API we already have. API-Football's free tier only serves historical
// seasons, so it can't help with current form.
let formFetched = 0;

async function fetchForm(slugs) {
  if (!slugs || !slugs.length) return;
  if (Date.now() - formFetched < 12 * 3600 * 1000) return;
  formFetched = Date.now();
  const form = {};
  for (const slug of slugs) {
    try {
      const r = await fetch('https://api.odds-api.io/v3/events?league=' + encodeURIComponent(slug)
                          + '&status=settled&apiKey=' + encodeURIComponent(ODDS_API_KEY));
      if (r.status === 429) { rateLimitedUntil = Date.now() + 3600000; break; }
      if (!r.ok) continue;
      const d = await r.json();
      const evs = (Array.isArray(d) ? d : (d.events || d.data || [])).filter(isSeniorMens);
      evs.sort((a, b) => new Date(b.date) - new Date(a.date));
      evs.forEach(ev => {
        const sc = scoreOf(ev);
        if (!sc) return;
        [[ev.home, sc.h, sc.a], [ev.away, sc.a, sc.h]].forEach(([team, mine, theirs]) => {
          if (!team) return;
          const f = form[team] = form[team] || { pts: 0, played: 0, seq: '' };
          if (f.played >= 5) return;
          f.played++;
          if (mine > theirs) { f.pts += 3; f.seq += 'W'; }
          else if (mine === theirs) { f.seq += 'D'; }
          else { f.seq += 'L'; }
        });
      });
    } catch (e) { /* skip */ }
  }
  if (Object.keys(form).length) {
    teamForm = form;
    setFixStatus('Form: ' + Object.keys(form).length + ' teams', 'good');
    renderPickPrompt();
  }
}

function formFor(team) {
  if (teamForm[team]) return teamForm[team];
  const k = Object.keys(teamForm).find(n => teamsMatch(n, team));
  return k ? teamForm[k] : null;
}
let fixturesFetched = 0;

// The events endpoint only returns a useful list when given a league slug,
// so ask for each of our competitions by name.
async function fetchLeagueFixtures() {
  if (typeof ODDS_API_KEY === 'undefined' || ODDS_API_KEY.indexOf('PASTE') === 0) return;
  if (Date.now() < rateLimitedUntil) return;
  if (Date.now() - fixturesFetched < 6 * 3600 * 1000) return;   // at most every 6h
  fixturesFetched = Date.now();

  let slugs = [];
  let note = '';
  try {
    const r = await fetch('https://api.odds-api.io/v3/leagues?sport=football&apiKey='
                        + encodeURIComponent(ODDS_API_KEY));
    if (r.status === 429) { rateLimitedUntil = Date.now() + 3600000; setFixStatus('Rate limited', 'bad'); return; }
    if (!r.ok) { note = 'leagues HTTP ' + r.status; }
    else {
      const d = await r.json();
      const list = Array.isArray(d) ? d : (d.leagues || d.data || []);
      note = 'leagues:' + list.length;
      slugs = list.filter(l => wantedLeague(((l.country && (l.country.name || l.country)) || '') + ' ' + (l.name || '')) || wantedLeague((l.slug || '').replace(/-/g, ' ')))
                  .map(l => l.slug || l.id).filter(Boolean).slice(0, 8);
      note += ' matched:' + slugs.length;
      if (!slugs.length && list.length) {
        const eng = list.filter(l => /eng/i.test((l.name || '') + (l.slug || '')))
                        .map(l => l.slug || l.name).slice(0, 3);
        note += ' eng-like:' + (eng.join(',') || 'none');
      }
    }
  } catch (e) { note = 'leagues failed'; }

  if (!slugs.length) {
    slugs = ['england-premier-league', 'england-championship', 'england-league-one',
             'england-league-two', 'england-national-league', 'scotland-league-one'];
  }

  const out = [];
  for (const slug of slugs) {
    try {
      const r = await fetch('https://api.odds-api.io/v3/events?league=' + encodeURIComponent(slug)
                          + '&apiKey=' + encodeURIComponent(ODDS_API_KEY));
      if (r.status === 429) { rateLimitedUntil = Date.now() + 3600000; break; }
      if (!r.ok) continue;
      const d = await r.json();
      const evs = Array.isArray(d) ? d : (d.events || d.data || []);
      evs.forEach(e => out.push(e));
    } catch (e) { /* skip this league */ }
  }
  if (out.length) {
    leagueFixtures = out.filter(isSeniorMens);
    setFixStatus('Fixtures: ' + leagueFixtures.length + ' from ' + slugs.length + ' leagues', 'good');
    fetchForm(slugs);
    renderPickPrompt();
  } else {
    setFixStatus('Fixtures: ' + note + ' \u00b7 tried ' + slugs.slice(0, 2).join(','), 'bad');
  }
}

const LEAGUE_ORDER = ['premier league', 'championship', 'league one', 'league two',
                      'national league', 'premiership', 'scottish'];

// Premier League down to National League, plus Scottish League One.
// The country must be explicit - plenty of countries have a "Premier League".
function wantedLeague(name) {
  const n = (name || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (/women|ladies|u1[5-9]|u2[0-3]|youth|academy|reserve/.test(n)) return false;

  const isEngland  = /\b(england|english)\b/.test(n);
  const isScotland = /\b(scotland|scottish)\b/.test(n);
  if (!isEngland && !isScotland) return false;

  if (isScotland) return /\bleague (one|1)\b/.test(n);

  return /\bpremier league\b/.test(n)
      || /\bchampionship\b/.test(n)
      || /\bleague (one|1)\b/.test(n)
      || /\bleague (two|2)\b/.test(n)
      || /\bnational league\b/.test(n);
}

function leagueName(ev) {
  return (ev.league && (ev.league.name || ev.league.slug)) || 'Other';
}

function leagueRank(name) {
  const n = name.toLowerCase();
  const uk = n.includes('england') || n.includes('scotland') || n.includes('english')
          || n.includes('scottish') || n.includes('efl');
  for (let i = 0; i < LEAGUE_ORDER.length; i++) {
    if (n.includes(LEAGUE_ORDER[i])) return uk ? i : 20 + i;
  }
  return uk ? LEAGUE_ORDER.length : 90;
}
let oddsBoard = {};        // { week_3: { taken: 1690..., odds: { 'Arsenal': 1.8, ... } } }
let boardRef = null;
let buildingBoard = false;

// One-time price snapshot, like the odds in a newspaper. Taken once per
// match week, stored in Firebase, read by everyone.
async function buildOddsBoard(week, fixtures) {
  if (buildingBoard) return;
  if (oddsBoard['week_' + week]) return;          // already taken
  if (typeof ODDS_API_KEY === 'undefined' || ODDS_API_KEY.indexOf('PASTE') === 0) return;
  if (Date.now() < rateLimitedUntil) return;
  buildingBoard = true;
  setOdds('Taking odds snapshot for match week ' + week + '\u2026');

  const odds = {};
  let calls = 0;
  for (const ev of fixtures) {
    if (calls >= 45) break;                       // stay inside the hourly cap
    if (!ev.id) continue;
    calls++;
    try {
      const r = await fetch('https://api.odds-api.io/v3/odds?eventId=' + encodeURIComponent(ev.id)
                          + '&bookmakers=Bet365,Unibet&apiKey=' + encodeURIComponent(ODDS_API_KEY));
      if (r.status === 429) { rateLimitedUntil = Date.now() + 3600000; break; }
      if (!r.ok) continue;
      const d = await r.json();
      const ml = extractMoneyline(d && d.bookmakers ? d : { bookmakers: (d && d.bookmakers) || d });
      if (ml) {
        if (ml.home > 1) odds[ev.home] = ml.home;
        if (ml.away > 1) odds[ev.away] = ml.away;
        if (ml.draw > 1) odds['DRAW::' + ev.id] = ml.draw;   // for probability maths
      }
    } catch (e) { /* skip this fixture */ }
  }

  buildingBoard = false;
  if (Object.keys(odds).length && boardRef) {
    const snap = { taken: Date.now(), odds: odds };
    oddsBoard['week_' + week] = snap;
    boardRef.child('week_' + week).set(snap).catch(() => {});
    setOdds('Odds snapshot taken \u00b7 ' + Object.keys(odds).length + ' prices', 'good');
    renderPickPrompt();
  } else {
    setOdds('Could not take odds snapshot \u2014 pick without prices', 'bad');
  }
}

// Implied chance of winning, with the bookmaker's margin stripped out.
// Uses home/draw/away where the draw price is available.
function winProbability(week, ev, team) {
  const b = oddsBoard['week_' + week];
  if (!b || !b.odds) return null;
  const h = boardOdds(week, ev.home), a = boardOdds(week, ev.away);
  const d = b.odds['DRAW::' + ev.id];
  const mine = teamsMatch(team, ev.home) ? h : a;
  if (!mine || mine <= 1) return null;
  let total = (h > 1 ? 1 / h : 0) + (a > 1 ? 1 / a : 0) + (d > 1 ? 1 / d : 0);
  if (!total) return null;
  return Math.round((1 / mine) / total * 100);
}

function boardOdds(week, team) {
  const b = oddsBoard['week_' + week];
  if (!b || !b.odds) return null;
  if (b.odds[team]) return b.odds[team];
  const key = Object.keys(b.odds).find(k => teamsMatch(k, team));
  return key ? b.odds[key] : null;
}

// Next Saturday's 3pm kickoffs only. Reads the fixture list the sync
// already fetched - no extra API calls.
function upcomingFixtures() {
  const now = Date.now();
  const horizon = now + 8 * 24 * 3600 * 1000;
  const source = leagueFixtures.length ? leagueFixtures : liveEvents;
  return source.filter(e => {
    if (!e.date) return false;
    const d = new Date(e.date);
    const t = d.getTime();
    if (isNaN(t) || t < now || t > horizon) return false;
    if (d.getDay() !== 6) return false;            // Saturday only
    const mins = d.getHours() * 60 + d.getMinutes();
    if (mins < 13 * 60 + 30 || mins > 16 * 60) return false;   // afternoon kickoffs
    return wantedLeague(leagueName(e));
  }).sort((a, b) => new Date(a.date) - new Date(b.date))
    .filter((e, _i, arr) => {
      // keep only the soonest Saturday's card
      const first = new Date(arr[0].date).toDateString();
      return new Date(e.date).toDateString() === first;
    });
}

function myPicksFor(week, person) {
  const gw = picks.find(g => g.week === week);
  return (gw && gw.entries && gw.entries[person]) || [];
}

function togglePick(week, person, team) {
  let gw = picks.find(g => g.week === week);
  if (!gw) {
    gw = { id: Date.now(), week, gameweek: 'Match week ' + week,
           entries: {}, payments: {}, lockUntil: upcomingSaturday5pm() };
    picks.push(gw);
    picks.sort((a, b) => (a.week || 0) - (b.week || 0));
  }
  if (!gw.entries) gw.entries = {};
  const list = gw.entries[person] ? gw.entries[person].slice() : [];
  const at = list.findIndex(x => x.team === team);
  if (at >= 0) list.splice(at, 1);
  else if (list.length < 2) {
    const entry = { team: team, result: 'pending' };
    const price = boardOdds(week, team);
    if (price) entry.odds = price;                // frozen at the snapshot price
    list.push(entry);
  }
  else { setOdds('Two picks each \u2014 tap one to swap it out', 'bad'); return; }
  gw.entries[person] = list;
  paymentsFor(gw);
  saveWeek(gw);
  renderAll();
}

function renderPickPrompt() {
  const el = document.getElementById('pickPrompt');
  if (!el) return;
  const wk = nextFreeWeek();
  if (!wk || !picksWindowOpen()) { el.innerHTML = ''; return; }

  const mine = myPicksFor(wk, pickerWho);
  const fixtures = upcomingFixtures();
  if (!fixtures.length) fetchLeagueFixtures();

  let html = `<div class="picker">
    <div class="picker-head">\u26BD Get your picks in for match week ${wk}</div>
    <div class="picker-sub">Saturday 3pm kickoffs</div>
    <div class="picker-who">
      <select id="pickerWho">${PARTICIPANTS.map(p =>
        `<option value="${escapeHtml(p)}" ${p === pickerWho ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('')}</select>
      <span class="picker-count">${mine.length}/2 chosen</span>
    </div>`;

  if (mine.length) {
    html += `<div class="picker-mine">${mine.map(m =>
      `<span class="picker-chip" data-team="${escapeHtml(m.team)}">${escapeHtml(m.team)} \u00d7</span>`).join('')}</div>`;
  }

  if (!fixtures.length) {
    const now = Date.now();
    const future = liveEvents.filter(e => e.date && new Date(e.date).getTime() > now);
    const sats = future.filter(e => new Date(e.date).getDay() === 6);
    let furthest = '';
    if (future.length) {
      const max = Math.max(...future.map(e => new Date(e.date).getTime()));
      furthest = new Date(max).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    }
    const times = {};
    sats.forEach(e => {
      const d = new Date(e.date);
      const k = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      times[k] = (times[k] || 0) + 1;
    });
    const common = Object.keys(times).sort((a, b) => times[b] - times[a]).slice(0, 6)
                     .map(k => k + ' (' + times[k] + ')').join(', ');
    html += `<div class="picker-note">No afternoon fixtures matched.<br>
      Feed: ${liveEvents.length} games \u00b7 ${future.length} upcoming \u00b7 ${sats.length} Saturday${furthest ? ' \u00b7 furthest ' + furthest : ''}.<br>
      Kickoff times seen: ${common || 'none'}.<br>
      Leagues: ${[...new Set(sats.map(e => leagueName(e)))].slice(0, 6).join(' / ') || 'none'}.<br>
      Use Log my picks meanwhile.</div>`;
  } else {
    // group by competition, Premier League first
    const groups = {};
    fixtures.slice(0, 80).forEach(ev => {
      const lg = leagueName(ev);
      (groups[lg] = groups[lg] || []).push(ev);
    });
    const names = Object.keys(groups).sort((a, b) => leagueRank(a) - leagueRank(b) || a.localeCompare(b));
    const isOpen = (lg) => openLeagues === null ? leagueRank(lg) === 0 : openLeagues.has(lg);

    html += `<div class="picker-list">`;
    names.forEach(lg => {
      const open = isOpen(lg);
      const chosenHere = groups[lg].filter(ev =>
        mine.some(m => m.team === ev.home || m.team === ev.away)).length;
      html += `<div class="lg-head" data-league="${escapeHtml(lg)}">
        <span class="chev">${open ? '\u25BE' : '\u25B8'}</span> ${escapeHtml(lg)}
        <span class="lg-count">${groups[lg].length}${chosenHere ? ' \u00b7 ' + chosenHere + ' picked' : ''}</span>
      </div>`;
      if (!open) return;
      groups[lg].forEach(ev => {
      const hSel = mine.some(m => m.team === ev.home);
      const aSel = mine.some(m => m.team === ev.away);
      const hO = boardOdds(wk, ev.home), aO = boardOdds(wk, ev.away);
      const hP = winProbability(wk, ev, ev.home), aP = winProbability(wk, ev, ev.away);
      html += `<div class="fixture">
        <button class="side ${hSel ? 'sel' : ''}" data-team="${escapeHtml(ev.home)}">${escapeHtml(ev.home)}${hO ? `<span class="side-odds">${toFractional(hO)}${hP ? ` <span class="side-prob">${hP}%</span>` : ''}</span>` : ''}</button>
        <span class="vs">v</span>
        <button class="side ${aSel ? 'sel' : ''}" data-team="${escapeHtml(ev.away)}">${escapeHtml(ev.away)}${aO ? `<span class="side-odds">${toFractional(aO)}${aP ? ` <span class="side-prob">${aP}%</span>` : ''}</span>` : ''}</button>
      </div>`;
      });
    });
    const b = oddsBoard['week_' + wk];
    const when = b && b.taken ? new Date(b.taken).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : null;
    html += `</div><div class="picker-note">${when
      ? 'Prices as at ' + when + ' \u2014 fixed, they won\u2019t move.'
      : 'Tap a team to back them. Prices load shortly.'}</div>`;
    if (!b) buildOddsBoard(wk, fixtures.slice(0, 45));
  }

  html += `</div>`;
  // Claude's pick: the six shortest-priced teams on the board
  const board = oddsBoard['week_' + wk];
  if (board && board.odds) {
    const ranked = [];
    fixtures.forEach(ev => {
      [ev.home, ev.away].forEach(team => {
        const pr = winProbability(wk, ev, team);
        const od = boardOdds(wk, team);
        if (!pr || !od) return;
        const opp = team === ev.home ? ev.away : ev.home;
        const f = formFor(team);
        const fp = f && f.played ? (f.pts / (f.played * 3)) * 100 : null;

        // head-to-head share of the last six meetings
        const h = h2hFor(team, opp);
        const hp = h ? Math.round((h.mine + h.d * 0.5) / h.total * 100) : null;

        // weight what we have; redistribute when something is missing
        let wSum = 0.6, total = pr * 0.6;
        if (fp !== null) { total += fp * 0.25; wSum += 0.25; }
        if (hp !== null) { total += hp * 0.15; wSum += 0.15; }
        const score = total / wSum;

        ranked.push({ team, pr, od, score, form: f, h2h: h, opp, home: team === ev.home });
      });
    });
    ranked.sort((a, b) => b.score - a.score);

    // pull head-to-head for the front-runners we haven't got yet
    const need = ranked.slice(0, 10).filter(r => {
      const fa = formFor(r.team), fb = formFor(r.opp);
      if (!fa || !fb || !fa.id || !fb.id) return false;
      return !([fa.id, fb.id].sort().join('-') in h2hCache);
    });
    if (need.length && !window.__h2hRunning) {
      window.__h2hRunning = true;
      (async () => {
        for (const r of need.slice(0, 6)) await fetchH2H(r.team, r.opp);
        window.__h2hRunning = false;
        renderPickPrompt();
      })();
    }
    // never both sides of the same match
    const usedFixtures = new Set();
    const top = ranked.filter(r => {
      const key = [r.team, r.opp].sort().join('|');
      if (usedFixtures.has(key)) return false;
      usedFixtures.add(key);
      return true;
    }).slice(0, 6);
    if (top.length) {
      html = html.replace('</div>', '');   // reopen the picker card
      html += `<div class="claude-pick">
        <div class="claude-head">Claude\u2019s six</div>
        <div class="claude-sub">Win probability, recent form and head-to-head</div>`;
      top.forEach((r, i) => {
        html += `<div class="claude-row">
          <span class="claude-rank">${i + 1}</span>
          <span class="claude-team">${escapeHtml(r.team)}<span class="claude-opp">${r.home ? 'v' : 'at'} ${escapeHtml(r.opp)}</span></span>
          <span class="claude-odds">${toFractional(r.od)}${r.form && r.form.seq ? `<span class="claude-form">${r.form.seq.split('').map(c => `<i class="f-${c}">${c}</i>`).join('')}</span>` : ''}</span>
          <span class="claude-prob">${r.pr}%${r.h2h ? `<span class="claude-h2h">H2H ${r.h2h.mine}-${r.h2h.d}-${r.h2h.theirs}</span>` : ''}</span>
        </div>`;
      });
      html += `</div></div>`;
    }
  }

  el.innerHTML = html;

  const sel = document.getElementById('pickerWho');
  if (sel) sel.addEventListener('change', () => { pickerWho = sel.value; renderPickPrompt(); });
  el.querySelectorAll('.lg-head').forEach(h => {
    h.addEventListener('click', () => {
      const lg = h.getAttribute('data-league');
      if (openLeagues === null) {
        openLeagues = new Set(Object.keys({}).concat(
          [...el.querySelectorAll('.lg-head')].map(x => x.getAttribute('data-league'))
        ).filter(n => leagueRank(n) === 0));
      }
      if (openLeagues.has(lg)) openLeagues.delete(lg); else openLeagues.add(lg);
      renderPickPrompt();
    });
  });
  el.querySelectorAll('.side, .picker-chip').forEach(btn => {
    btn.addEventListener('click', () => togglePick(wk, pickerWho, btn.getAttribute('data-team')));
  });
}

// Live scores for the current match week's picks
function renderFollow() {
  const el = document.getElementById('followSection');
  if (!el) return;
  // The week actually in play: the earliest one that still has results
  // outstanding. Falls back to the most recent week if everything is settled.
  let gw = picks
    .filter(g => PARTICIPANTS.some(p => (g.entries && g.entries[p] || [])
                    .some(pk => pk.result === 'pending')))
    .sort((a, b) => (a.week || 0) - (b.week || 0))[0];
  if (!gw) gw = picks.find(g => g.week === currentWeek());
  if (!gw) { el.innerHTML = ''; return; }
  const w = gw.week;

  // one row per distinct team, noting who backed it
  const byTeam = {};
  PARTICIPANTS.forEach(person => {
    (gw.entries[person] || []).forEach(pick => {
      if (!pick.team) return;
      if (!byTeam[pick.team]) byTeam[pick.team] = [];
      byTeam[pick.team].push(person.split(' ')[0]);
    });
  });
  const teams = Object.keys(byTeam);
  if (!teams.length) { el.innerHTML = ''; return; }

  let html = `<div class="follow">
    <div class="follow-head">Match week ${w} \u00b7 today\u2019s games</div>
    <table class="follow-table"><thead><tr>
      <th>Fixture</th><th class="c">Score</th><th class="c">Backed by</th>
    </tr></thead><tbody>`;

  let anyScore = false;
  teams.forEach(team => {
    const q = encodeURIComponent(team + ' score');
    const ev = findEvent(liveEvents, team);
    const sc = ev ? scoreOf(ev) : null;
    const atHome = ev ? teamsMatch(team, ev.home) : true;
    const opp = ev ? (atHome ? ev.away : ev.home) : '';

    let fixture = `<strong>${escapeHtml(team)}</strong>`;
    if (opp) fixture += `<span class="follow-fix">${atHome ? 'v ' : 'at '}${escapeHtml(opp)}</span>`;

    let scoreCell;
    if (sc) {
      anyScore = true;
      const mine = atHome ? sc.h : sc.a;
      const theirs = atHome ? sc.a : sc.h;
      const tone = mine > theirs ? '#00ff85' : mine === theirs ? '#04f5ff' : '#ff5c8a';
      scoreCell = `<span class="follow-score" style="color:${tone}">${mine}\u2013${theirs}</span>`;
    } else {
      scoreCell = `<a class="follow-link" href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">${ev && kickoffOf(ev) ? kickoffOf(ev) : 'Live'}</a>`;
    }

    html += `<tr>
      <td>${fixture}</td>
      <td class="c">${scoreCell}</td>
      <td class="c follow-who">${escapeHtml(byTeam[team].join(', '))}</td>
    </tr>`;
  });

  html += `</tbody></table>
    <a class="flashscore-btn" href="https://www.flashscore.co.uk/" target="_blank" rel="noopener">Open Flashscore</a>
    <div class="follow-note">${anyScore
      ? 'Scores refresh automatically.'
      : 'Scores appear once matches are under way. Tap the time for the running score meanwhile.'}</div></div>`;

  el.innerHTML = html;
}

function renderKitty() {
  const section = document.getElementById('kittySection');
  if (picks.length === 0) { section.innerHTML = ''; return; }

  const { banked, outstanding, week } = kittyTotals();
  const debts = netDebts();

  let html = `<div class="kitty">
    <div class="kitty-head">
      <span class="kitty-label">Match week ${week} kitty</span>
      <span class="kitty-total">\u00a3${banked}<small>of \u00a3${banked + outstanding}</small></span>
    </div>`;

  // Who still owes their stake for this week
  const gwNow = picks.find(g => g.week === week);
  if (gwNow) {
    const pay = paymentsFor(gwNow);
    const owing = PARTICIPANTS.filter(p => pay[p].status === 'unpaid');
    if (owing.length) {
      html += `<div class="arrears">Still to pay: ${owing.map(escapeHtml).join(', ')}</div>`;
    } else {
      html += `<div class="owed-clear">Everyone\u2019s paid in for match week ${week}.</div>`;
    }
  }

  const wksIn = usedWeeks().length;
  html += `<div class="pay-divider">Prize pot</div>
    <div class="pot-row">
      <span>\u00a3${PRIZE_STAKE} each \u00b7 ${wksIn} week${wksIn === 1 ? '' : 's'} in</span>
      <span class="pot-total">\u00a3${prizePot()}</span>
    </div>
    <div class="pot-note">Paid out at the end of the season: 80% to 1st, 20% to 2nd</div>`;

  html += `<div class="pay-divider">Who owes who</div>`;
  if (debts.length === 0) {
    html += `<div class="owed-clear">Nobody owes anybody. All square.</div>`;
  } else {
    debts.forEach(d => {
      html += `<div class="debt-row">
        <span>${escapeHtml(d.debtor)} \u2192 ${escapeHtml(d.creditor)}</span>
        <span class="debt-amount">\u00a3${d.amount}</span>
      </div>`;
    });
  }

  html += `</div>`;
  section.innerHTML = html;
}
function renderSeasonLine() {
  const next = nextFreeWeek();
  const el = document.getElementById('seasonLine');
  if (!el) return;
  if (!next) {
    el.textContent = `Season complete \u00b7 all ${TOTAL_WEEKS} match weeks played`;
    return;
  }
  const inThisWeek = loggedCount(next);
  el.textContent = inThisWeek === 0
    ? `Match week ${next} of ${TOTAL_WEEKS} \u00b7 no picks in yet`
    : `Match week ${next} of ${TOTAL_WEEKS} \u00b7 ${inThisWeek} of ${PARTICIPANTS.length} in`;
}

document.getElementById('saveGwBtn').addEventListener('click', () => {
  const week = Number(document.getElementById('gwName').value);
  const person = document.getElementById('whoAmI').value;
  const errorEl = document.getElementById('formError');
  errorEl.style.display = 'none';

  if (!week || !person) {
    errorEl.textContent = "Pick a match week and choose who you are.";
    errorEl.style.display = 'block';
    return;
  }

  const inputs = document.querySelectorAll('.team-input');
  const list = [];
  let ok = true;
  const gwExisting = picks.find(g => g.week === week);
  const oddsBoxes = document.querySelectorAll('.odds-input');
  inputs.forEach((inp, i) => {
    const team = inp.value.trim();
    if (!team) ok = false;
    const raw = oddsBoxes[i] ? parseOdds(oddsBoxes[i].value) : null;
    const prior = (gwExisting && gwExisting.entries && gwExisting.entries[person] && gwExisting.entries[person][i]) || null;
    const entry = { team, result: prior && prior.team === team ? prior.result : 'pending' };
    if (raw) entry.odds = raw;
    list.push(entry);
  });
  if (!ok) {
    errorEl.textContent = "Both of your teams need filling in.";
    errorEl.style.display = 'block';
    return;
  }

  let gw = picks.find(g => g.week === week);
  if (!gw) {
    gw = { id: Date.now(), week, gameweek: `Match week ${week}`, entries: {}, payments: {}, lockUntil: upcomingSaturday5pm() };
    picks.push(gw);
    picks.sort((a, b) => (a.week || 0) - (b.week || 0));
  }
  if (!gw.entries) gw.entries = {};
  gw.entries[person] = list;
  paymentsFor(gw);

  saveWeek(gw);
  document.getElementById('formPanel').style.display = 'none';
  document.getElementById('showFormBtn').style.display = 'block';
  renderAll();
});
document.getElementById('backfillBtn').addEventListener('click', backfillWeek1);
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Wipe every match week back to week 1? This cannot be undone.')) {
    if (seasonRef) seasonRef.remove();
    picks = [SEED_WEEK_1];
    saveWeek(SEED_WEEK_1);
    renderAll();
  }
});

initFirebase();
setInterval(() => { if (picks.length) renderAll(); }, 60000);
// Poll hard while Saturday afternoon games are on, then back right off.
function syncIntervalMs() {
  const d = new Date();
  const sat = d.getDay() === 6;
  const hr = d.getHours();
  if (sat && hr >= 15 && hr < 17) return 5 * 60 * 1000;      // 3-5pm Sat: every 5 min
  if (sat && hr >= 12 && hr < 19) return 30 * 60 * 1000;     // rest of Sat: every 30 min
  return 12 * 60 * 60 * 1000;                                // otherwise: twice a day
}

let syncTimer = null;
function scheduleSync() {
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    syncOddsAndResults();
    scheduleSync();
  }, syncIntervalMs());
}

setTimeout(() => { syncOddsAndResults(); scheduleSync(); }, 2500);
